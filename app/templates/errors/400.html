{% extends "base.html" %}
{% block title %}Zentra — 400 Bad Request{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-24 text-center fade-up">
  <span class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-600 border border-amber-200 flex items-center justify-center mx-auto mb-6 text-2xl font-bold">
    <i class="bi bi-exclamation-triangle"></i>
  </span>
  <h1 class="text-3xl font-extrabold text-ink tracking-tight">Bad Request</h1>
  <p class="text-slate-500 mt-3 text-sm leading-relaxed">
    {{ error_message or "The request could not be processed due to invalid parameters or malformed data." }}
  </p>
  <div class="mt-8 flex items-center justify-center gap-3">
    <a href="javascript:history.back()" class="border border-slate-200 text-slate-700 text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-slate-50 transition-colors">
      Go Back
    </a>
    <a href="{{ url_for('main.landing') }}" class="bg-ink text-white text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-slate-800 transition-colors shadow-sm">
      Return Home
    </a>
  </div>
</div>
{% endblock %}
