{% extends "base.html" %}
{% block title %}Zentra — 404 Page Not Found{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-6 py-24 text-center fade-up">
  <span class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-700 border border-indigo-200 flex items-center justify-center mx-auto mb-6 text-2xl font-bold">
    404
  </span>
  <h1 class="text-3xl font-extrabold text-ink tracking-tight">Page Not Found</h1>
  <p class="text-slate-500 mt-3 text-sm leading-relaxed">
    The page you are looking for does not exist, has been moved, or is temporarily unavailable.
  </p>
  <div class="mt-8 flex items-center justify-center gap-3">
    <a href="javascript:history.back()" class="border border-slate-200 text-slate-700 text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-slate-50 transition-colors">
      Go Back
    </a>
    <a href="{{ url_for('main.landing') }}" class="bg-ink text-white text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-slate-800 transition-colors shadow-sm">
      Return Home
    </a>
  </div>
</div>
{% endblock %}
